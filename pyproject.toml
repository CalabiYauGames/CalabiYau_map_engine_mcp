[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "calabiyau-map-engine-mcp"
version = "0.1.0"
description = "Local MCP bridge for the CalabiYau browser map editor."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "platformdirs>=4.3,<5",
    "pydantic>=2.11,<3",
    "starlette>=0.47,<1",
    "uvicorn>=0.35,<1",
    "websockets>=15,<17",
]

[project.scripts]
calabiyau-map-engine-mcp = "calabiyau_map_engine_mcp.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "httpx2>=2.16,<3",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: needs a real editor tab paired with a running server (set CALABIYAU_MCP_LIVE=1)",
]

[tool.coverage.run]
source = ["calabiyau_map_engine_mcp"]

[tool.coverage.report]
# The CLI and the uvicorn entrypoint only run in subprocesses, so they read as 0% here.
omit = ["*/__main__.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["src/calabiyau_map_engine_mcp"]
